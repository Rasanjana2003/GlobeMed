<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Auction</title>
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 50px;
            min-height: 100vh;
            background: linear-gradient(135deg, #141E30, #243B55);
            color: #fff;
        }

        .container {
            background-color: rgba(0, 0, 0, 0.75);
            padding: 40px 30px;
            border-radius: 12px;
            width: 400px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 26px;
            letter-spacing: 1px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        input, textarea {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 20px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
        }

        input:focus, textarea:focus {
            outline: 2px solid #1dd1a1;
            background-color: #f0f0f0;
            color: #000;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: #1dd1a1;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background-color: #10ac84;
        }

        .message {
            margin-top: 15px;
            font-weight: 500;
            text-align: center;
            color: #ff6b6b;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Create New Auction Item</h1>
    <form id="auctionForm">
        <label for="itemId">Item Id</label>
        <input type="text" id="itemId" required>

        <label for="name">Item Name</label>
        <input type="text" id="name" required>

        <label for="description">Description</label>
        <textarea id="description" rows="3" required></textarea>

        <label for="startingPrice">Starting Price</label>
        <input type="number" id="startingPrice" step="0.01" required>

        <button type="submit">Create Auction</button>
        <div class="message" id="message"></div>
    </form>
</div>

<script>
    const form = document.getElementById("auctionForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async function (e) {
        e.preventDefault();

        const item = {
            id: Number(document.getElementById("itemId").value),
            title: document.getElementById("name").value,
            description: document.getElementById("description").value,
            startingPrice: Number(document.getElementById("startingPrice").value)
        };

        try {
            const response = await fetch("api/auction/item", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(item)
            });

            if (response.ok) {
                message.style.color = "#1dd1a1";
                message.textContent = "Auction item created successfully!";
                form.reset();
            } else {
                const errorText = await response.text();
                message.style.color = "#ff6b6b";
                message.textContent = "Failed: " + errorText;
            }
        } catch (err) {
            message.style.color = "#ff6b6b";
            message.textContent = "Error: " + err.message;
        }
    });
</script>
</body>
</html>
