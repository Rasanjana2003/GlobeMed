<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place a Bid</title>
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 50px;
            min-height: 100vh;
            background: linear-gradient(135deg, #141E30, #243B55);
            color: #fff;
        }

        .container {
            background-color: rgba(0, 0, 0, 0.75);
            padding: 40px 30px;
            border-radius: 12px;
            width: 400px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 26px;
            letter-spacing: 1px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 20px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
        }

        input:focus {
            outline: 2px solid #1dd1a1;
            background-color: #f0f0f0;
            color: #000;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: #1dd1a1;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background-color: #10ac84;
        }

        #responseMsg {
            margin-top: 15px;
            font-weight: 500;
            text-align: center;
            color: #ff6b6b;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Place a Bid</h2>
    <form id="bidForm">
        <label for="itemId">Item ID:</label>
        <input type="number" id="itemId" name="itemId" required>

        <label for="amount">Bid Amount:</label>
        <input type="number" step="0.01" id="amount" name="amount" required>

        <button type="submit">Place Bid</button>
    </form>
    <p id="responseMsg"></p>
</div>

<script>
    document.getElementById('bidForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const amount = Number(document.getElementById('amount').value);
        const itemId = Number(document.getElementById('itemId').value);

        const itemsRes = await fetch('api/auction/items');
        const items = await itemsRes.json();

        const item = items.find(i => i.id === itemId);
        if (!item) {
            document.getElementById('responseMsg').innerText = "Invalid item ID";
            return;
        }

        if (amount <= item.startingPrice) {
            document.getElementById('responseMsg').innerText = "Bid must be higher than the starting price";
            return;
        }

        const bid = { itemId, amount };

        try {
            const res = await fetch('api/auction/bid', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(bid)
            });

            const msg = await res.text();
            document.getElementById('responseMsg').innerText = msg;
        } catch (err) {
            document.getElementById('responseMsg').innerText = "Failed to place bid";
        }
    });
</script>
</body>
</html>
