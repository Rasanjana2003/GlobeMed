<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Auctions</title>
  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #141E30, #243B55);
      color: #fff;
      min-height: 100vh;
      padding: 40px 20px;
    }

    h2 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 28px;
      letter-spacing: 1px;
    }

    #itemsContainer {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 800px;
      margin: 0 auto;
    }

    .item {
      background-color: rgba(0, 0, 0, 0.75);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.5);
    }

    .item strong {
      color: #1dd1a1;
    }

    .bids {
      margin-top: 15px;
      background-color: rgba(255,255,255,0.05);
      padding: 12px;
      border-radius: 8px;
    }

    .bids ul {
      list-style-type: none;
      padding-left: 10px;
      margin-top: 8px;
    }

    .bids li {
      margin-bottom: 6px;
      padding: 4px 0;
      border-bottom: 1px dashed rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>
<h2>Available Auction Items</h2>
<div id="itemsContainer"></div>

<script>
  async function fetchItemsAndBids() {
    const itemsRes = await fetch('api/auction/items');
    const bidsRes = await fetch('api/auction/bids');
    const items = await itemsRes.json();
    const bids = await bidsRes.json();

    const container = document.getElementById('itemsContainer');
    container.innerHTML = '';

    items.forEach(item => {
      const itemDiv = document.createElement('div');
      itemDiv.className = 'item';
      itemDiv.innerHTML = `
          <strong>Item ID:</strong> ${item.id}<br>
          <strong>Title:</strong> ${item.title || '(Untitled)'}<br>
          <strong>Description:</strong> ${item.description || 'No description'}<br>
          <strong>Min Price:</strong> Rs.${item.startingPrice}<br>
          <div class="bids">
            <strong>Bid History:</strong>
            <ul id="bids-${item.id}"></ul>
          </div>
        `;

      const bidList = itemDiv.querySelector(`#bids-${item.id}`);
      bids
              .filter(bid => bid.itemId === item.id)
              .forEach(bid => {
                const li = document.createElement('li');
                li.innerText = `${bid.username} - Rs.${bid.amount} at ${new Date(bid.timestamp).toLocaleString()}`;
                bidList.appendChild(li);
              });

      container.appendChild(itemDiv);
    });
  }

  window.onload = fetchItemsAndBids;
</script>
</body>
</html>
